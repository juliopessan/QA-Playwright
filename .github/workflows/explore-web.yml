name: Análise pela web

# Disparado pela landing page (função /api/analyze na Vercel). Explora o site em modo somente
# leitura com todas as análises e publica o relatório como artefato, lido por /api/status e /api/report.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL do site a analisar"
        required: true
      payload:
        description: "Credenciais cifradas (AES-256-GCM com QA_INPUT_KEY)"
        required: false
        default: ""
      request_id:
        description: "Id do pedido (UUID)"
        required: true

run-name: explore ${{ inputs.request_id }}

permissions:
  contents: read

concurrency:
  group: explore-web
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Abrir credenciais do pedido
        env:
          QA_PAYLOAD: ${{ inputs.payload }}
          QA_INPUT_KEY: ${{ secrets.QA_INPUT_KEY }}
        run: node scripts/open-input.mjs

      - name: Explorar e analisar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          mkdir -p qa-report
          set +e
          node dist/cli/index.js explore "$TARGET_URL" --out-dir qa-report --max-telas 25 --max-llm-calls 150 --env-file /dev/null 2> >(tee qa-report/erro.txt >&2)
          code=$?
          set -e
          # Exploração concluída (0) ou fluxo reprovado (1) geram relatório; o erro só fica se não houver.
          if ls qa-report/*/relatorio.html >/dev/null 2>&1; then rm -f qa-report/erro.txt; fi
          # O erro vai para a página: nunca com o usuário ou a senha dentro.
          if [ -f qa-report/erro.txt ]; then node scripts/redact-file.mjs qa-report/erro.txt; fi
          echo "Código de saída: $code"
          exit 0

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ inputs.request_id }}
          path: qa-report/
          if-no-files-found: warn
          retention-days: 7
