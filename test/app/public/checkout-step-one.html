<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Swag Labs (local)</title><link rel="stylesheet" href="/style.css"></head>
<body data-page="checkout-one">
  <header id="header"></header>
  <h1>Checkout: Your Information</h1>
  <form id="info-form">
    <input type="text" aria-label="First Name" placeholder="First Name" id="first-name">
    <input type="text" aria-label="Last Name" placeholder="Last Name" id="last-name">
    <input type="text" aria-label="Zip/Postal Code" placeholder="Zip/Postal Code" id="postal-code">
    <div id="error-slot"></div>
    <input type="submit" value="Continue" id="continue">
  </form>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body></html>
