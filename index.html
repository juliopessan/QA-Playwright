<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>QA Agent · Loja de teste</title><link rel="stylesheet" href="style.css"></head>
<body data-page="login">
  <h1>QA Agent</h1>
  <p>Site de teste do QA Agent. Não é a SauceDemo; credenciais apenas para testes.</p>
  <form id="login-form">
    <input type="text" aria-label="Username" placeholder="Username" id="user-name">
    <input type="password" aria-label="Password" placeholder="Password" id="password">
    <input type="submit" value="Login" id="login-button">
    <div id="error-slot"></div>
  </form>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body></html>
